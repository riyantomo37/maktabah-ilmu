<style>
/* Layout: a walnut bookcase as the home screen; a paper reader with scroll or page-turn modes. */
:root{
  --bg:#E9ECE6; --bg2:#DFE3DC; --paper:#FAF9F4; --ink:#18241F; --muted:#5A6A62; --line:#C9D0C7;
  --gold:#94701F; --gold-soft:#E8D9AE; --lapis:#234A73; --wood:#3B2A1F; --wood2:#2A1D15; --shadow:rgba(24,36,31,.16);
  --f-display:"Marcellus","Cormorant",Georgia,serif;
  --f-body:"Spectral","Noto Serif JP",Georgia,serif;
  --f-ui:"Figtree","Noto Sans JP",system-ui,sans-serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --fs:1.06rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --bg2:#151E1A; --paper:#19221E; --ink:#E3E8E1; --muted:#97A69E; --line:#2C3833;

:root[data-theme="dark"]{
  --bg:#0F1613; --bg2:#151E1A; --paper:#19221E; --ink:#E3E8E1; --muted:#97A69E; --line:#2C3833;
  --gold:#D4AC5C; --gold-soft:#3A3220; --lapis:#8FB3DA; --wood:#2B1F17; --wood2:#1A120D; --shadow:rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.lang-ja h1,.lang-ja h2,.lang-ja h3{font-family:"Noto Serif JP",serif;font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.3rem;letter-spacing:.02em}
.brand span{font-family:var(--f-ar);color:var(--gold);font-size:1.25rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg2)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:.82rem;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg button.ar{font-family:var(--f-ar);font-size:.95rem;line-height:1.1}

/* library */
.hero{padding-block:34px 18px;display:grid;gap:10px}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.1}
.hero p{margin:0;color:var(--muted);max-width:60ch;font-size:1rem}
.hero .ayah{font-family:var(--f-ar);color:var(--gold);font-size:1.5rem;direction:rtl}
.resume{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.case{background:linear-gradient(180deg,var(--wood),var(--wood2));border-radius:10px;padding:18px 18px 0;margin-block:14px 40px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.18),0 10px 30px var(--shadow)}
.shelf{margin-bottom:22px}
.shelf h2{color:#E9D9AE;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-ui);font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.shelf h2 small{font-family:var(--f-ar);letter-spacing:0;text-transform:none;font-size:1.1rem;color:#C9A55A;font-weight:400}
.row{display:flex;align-items:flex-end;gap:6px;padding:14px 8px 0;overflow-x:auto;scrollbar-width:thin;border-bottom:12px solid #1A110B;box-shadow:0 10px 0 -2px rgba(0,0,0,.35);min-height:236px}
.spine{flex:0 0 auto;width:var(--w,58px);height:var(--h,210px);border:0;border-radius:3px 3px 1px 1px;background:var(--c);color:#EBD9A6;position:relative;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  box-shadow:inset 3px 0 0 rgba(255,255,255,.12),inset -5px 0 8px rgba(0,0,0,.35),2px 0 0 rgba(0,0,0,.3);
  transition:transform .25s ease;transform-origin:bottom center}
.spine:hover,.spine:focus-visible{transform:translateY(-10px)}
.spine::before,.spine::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:#C9A55A;opacity:.85;box-shadow:0 5px 0 #C9A55A}
.spine::before{top:12px}.spine::after{bottom:20px}
.spine .t{writing-mode:vertical-rl;font-family:var(--f-display);font-size:.92rem;letter-spacing:.04em;margin-top:26px;max-height:128px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spine .a{font-family:var(--f-ar);font-size:1rem;margin-bottom:28px;writing-mode:vertical-rl;max-height:76px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spine.soon{filter:saturate(.25) brightness(.8);cursor:default}
.spine.soon:hover{transform:none}
.spine .tag{position:absolute;bottom:4px;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;font-family:var(--f-ui);opacity:.85}
.note{color:var(--muted);font-size:.86rem;max-width:70ch;padding-bottom:40px}
.note a{color:var(--lapis)}
.ribbon{position:absolute;top:-1px;right:34px;width:22px;height:54px;background:#9E2B2B;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 2px 4px var(--shadow);z-index:2;pointer-events:none}
.spine .rb{position:absolute;top:-6px;right:7px;width:10px;height:64px;background:#C43C3C;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 6px),0 100%);z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.marks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.marks .lbl{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.84rem;color:var(--ink);text-decoration:none}
.chip:hover{border-color:var(--gold)}
.chip svg,.iconbtn svg,.lbl svg{width:14px;height:14px}
.iconbtn.on{color:#B33A3A;border-color:#B33A3A}
.h.marked{border-left:4px solid #B33A3A}
.tomark{font-size:.8rem}
.chip[hidden]{display:none}
.pdfbox{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--paper);display:grid;gap:10px}
.pdfbox h3{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.pdfbox .vols{display:flex;flex-wrap:wrap;gap:6px}
.pdfbox .vols a{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.82rem;color:var(--lapis);text-decoration:none;font-variant-numeric:tabular-nums}
.pdfbox .vols a:hover{border-color:var(--lapis)}
.pdfbox p{margin:0;font-size:.78rem;color:var(--muted)}
a.spine{text-decoration:none}

/* book detail */
.detail{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:32px;padding-block:28px 50px}
@media (max-width:720px){.detail{grid-template-columns:1fr;gap:20px}}
.cover{aspect-ratio:3/4.2;max-width:100%;width:100%;border-radius:4px 10px 10px 4px;background:var(--c);color:#EBD9A6;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;box-shadow:inset 10px 0 14px rgba(0,0,0,.35),0 14px 30px var(--shadow)}
@media (max-width:720px){.cover{max-width:220px;margin-inline:auto}}
.cover svg{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.cover .ca{font-family:var(--f-ar);font-size:1.9rem;line-height:1.3;position:relative}
.cover .ce{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.06em;position:relative}
.cover .frame{position:absolute;inset:14px;border:1px solid rgba(233,217,174,.55);border-radius:3px}
.meta{min-width:0;display:grid;gap:14px;align-content:start}
.meta .back{justify-self:start}
.meta h1{font-size:clamp(1.7rem,4vw,2.5rem)}
.meta .arname{font-family:var(--f-ar);font-size:1.6rem;color:var(--gold);direction:rtl;text-align:left}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.88rem}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.toc{border-top:1px solid var(--line);margin-top:6px}
.toc button{display:grid;grid-template-columns:2.6rem 1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 4px}
.toc button:hover{background:var(--bg2)}
.toc .no{color:var(--gold);font-variant-numeric:tabular-nums;font-size:.85rem}
.toc .nm{font-family:var(--f-body);font-size:1rem;min-width:0}
.toc .ct{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.filter{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}

/* reader */
.rbar .wrap{gap:8px;flex-wrap:nowrap}
.rbar .ttl{min-width:0;flex:1 1 120px;display:flex;align-items:center;gap:8px}
.rbar .ttl select{min-width:0;max-width:100%;flex:1;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 8px;font-size:.86rem}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:0 0 auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:700px){.tools{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}.tools>*{flex:0 0 auto}}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--bg2)}
.chk input{accent-color:var(--gold);margin:0}
.chap-head{text-align:center;padding-block:30px 10px;display:grid;gap:6px}
.chap-head .k{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.chap-head h2{font-size:clamp(1.4rem,3.5vw,2rem)}
.chap-head p{margin:0;color:var(--muted);font-size:.85rem}
.scroll{max-width:760px;margin:0 auto;padding-bottom:40px}
.h{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-block:14px;content-visibility:auto;contain-intrinsic-size:auto 260px}
.hn{display:flex;align-items:center;gap:10px;font-size:.76rem;color:var(--muted);margin-bottom:10px;min-width:0}
.hn .num{font-family:var(--f-display);color:var(--gold);font-size:1rem;border:1px solid var(--gold);border-radius:999px;min-width:2.2rem;padding:0 8px;text-align:center;font-variant-numeric:tabular-nums}
.hn .grade{margin-left:auto;font-size:.7rem;color:var(--gold);border:1px solid var(--gold-soft);padding:1px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:calc(var(--fs) * 1.28);line-height:1.95;margin:0 0 12px}
.tr{font-family:var(--f-body);font-size:var(--fs);line-height:1.72;margin:0;white-space:pre-line}
.setpanel{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:4px 12px}
.setpanel[hidden]{display:none!important}
.fexit{position:fixed;z-index:30;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px;opacity:.55;transition:opacity .2s}
.fexit:hover,.fexit:focus-within{opacity:1}
body.focus .rbar,body.focus .pager{display:none}
body.focus .bookstage{padding-block:max(6px,env(safe-area-inset-top,0px)) 4px}
.bookstage{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body.focus .scroll{padding-top:30px}
.lang-ja .tr.ja{font-family:"Noto Serif JP",serif}
.tr[lang="ja"]{font-family:"Noto Serif JP",serif;line-height:1.9}
.quran{font-family:"Amiri Quran","Amiri",serif;line-height:2.25}
.verse{font-family:"Amiri Quran","Amiri",serif;direction:rtl;text-align:right;font-size:calc(var(--fs) * 1.15);line-height:2.1;margin:0 0 12px;padding:4px 14px;border-right:3px solid var(--gold);color:var(--ink)}
.book.sized .verse{font-size:calc(var(--fsb) * 1.08)}
.bism{text-align:center!important;color:var(--gold);margin:8px 0 0}
.stats{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fallback{font-size:.72rem;color:var(--lapis);margin:0 0 6px;font-family:var(--f-ui)}
.empty{color:var(--muted);font-style:italic}
.pager{display:flex;justify-content:space-between;gap:10px;max-width:760px;margin:10px auto 50px;flex-wrap:wrap}

/* book (page-turn) mode */
.bookstage{display:flex;flex-direction:column;align-items:center;padding-block:16px 10px;gap:10px}
.book{position:relative;width:min(100%,1000px);height:var(--bh,70vh);display:grid;grid-template-columns:1fr;perspective:2200px;touch-action:pan-y}
.book.spread{grid-template-columns:1fr 1fr}
.book.sized{max-width:none;flex:0 0 auto}
.book.sized .pg{padding:var(--pt) var(--px) var(--pb)}
.book.sized .tr{font-size:var(--fsb)}
.book.sized .ar{font-size:calc(var(--fsb) * 1.18)}
.book.sized .hn .num{font-size:calc(var(--fsb) * .85)}
.book.sized .chap-head h2{font-size:calc(var(--fsb) * 1.45)}
.book.sized .folio{bottom:calc(var(--pb) * .35)}
body.focus{background:var(--bg2)}
body.focus .setpanel{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px var(--shadow);padding:12px 14px;width:max-content;max-width:calc(100% - 24px);justify-content:center}
body.focus .bnav{gap:8px;flex-wrap:wrap;justify-content:center}
.pg{background:var(--paper);border:1px solid var(--line);position:relative;overflow:auto;padding:34px 40px 44px;box-shadow:0 10px 26px var(--shadow)}
.book.spread .pg.l{border-radius:8px 0 0 8px;box-shadow:inset -18px 0 24px -18px var(--shadow),0 10px 26px var(--shadow)}
.book.spread .pg.r{border-radius:0 8px 8px 0;border-left:0;box-shadow:inset 18px 0 24px -18px var(--shadow),0 10px 26px var(--shadow)}
.book:not(.spread) .pg{border-radius:4px 8px 8px 4px;box-shadow:inset 14px 0 18px -14px var(--shadow),0 10px 26px var(--shadow)}
.pg .hn:not(:first-child){border-top:1px dashed var(--line);padding-top:14px;margin-top:16px}
.pg .ar{margin-bottom:8px}
.pg .tr{margin-bottom:6px}
.pg .folio{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pg .chap-head{padding-block:4px 14px;gap:4px}
.pg .chap-head h2{font-size:1.35rem}
.pg .chap-head .k{font-size:.66rem}
.leaf{position:absolute;top:0;bottom:0;transform-style:preserve-3d;z-index:5;pointer-events:none}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.bnav{display:flex;align-items:center;gap:14px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.measure{position:absolute;visibility:hidden;left:-9999px;top:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:.84rem;z-index:50}
@media (max-width:560px){.pg{padding:20px 18px 36px}.h{padding:16px}.hide-s{display:none}}
@media (prefers-reduced-motion:reduce){.spine{transition:none}}
</style>

</head>

        <span><b>${fmt(b.total)}</b> ${esc(t(b.kind==="hadith"?"hadith":"ayah"))}</span><span><b>${fmt(b.secs.length)}</b> ${esc(t("chapters"))}</span></div>
      <div class="resume"><a class="btn" href="${cont?atLink(id,cont.s,cont.n):"#read-"+id+"-"+enc(b.secs[0].k)}">${esc(cont?t("resume"):t("start"))}</a>${getMarks()[id]?`<a class="btn ghost" href="${atLink(id,getMarks()[id].s,getMarks()[id].n)}"><span style="color:#B33A3A;display:inline-flex">${RIB_F}</span> ${esc(t("toMark"))} · ${esc(unitOf(b))} ${fmt(getMarks()[id].n)}</a>`:""}</div>
      ${b.secs.length>6?`<input class="filter" id="tocfilter" type="search" placeholder="${esc(t("filter"))}">`:""}
      ${b.partial?`<p class="note" style="padding:0">${esc(t("partial"))}</p>`:""}
      ${pdfBox(id)}
      <nav class="toc" id="toc">${b.secs.map((s,i)=>`<button data-s="${enc(s.k)}" data-name="${esc((s.t+" "+(s.ta||"")).toLowerCase())}"><span class="no">${s.k==="0"&&s.f>1?"+":i+(b.secs[0].k==="0"&&b.secs[0].f<=1?0:1)}</span><span class="nm">${esc(secTitle(s))}${b.kind!=="hadith"&&s.ta&&S.lang!=="ar"?` <span style="font-family:var(--f-ar);color:var(--gold)">${esc(s.ta)}</span>`:""}</span><span class="ct">${fmt(s.c)} · ${fmt(s.f)}–${fmt(s.l)}</span></button>`).join("")}</nav>
    </div></div></main>`;
  app.querySelectorAll("#toc button").forEach(x=>x.onclick=()=>go(`read-${id}-${x.dataset.s}`));
  const f=document.getElementById("tocfilter");
  if(f)f.oninput=()=>{const q=f.value.trim().toLowerCase();app.querySelectorAll("#toc button").forEach(x=>x.hidden=q&&!x.dataset.name.includes(q))};
  bindLang(app,render);
}

/* ---------- hadith rendering ---------- */
function unitOf(b){return t((b&&b.kind||"hadith")==="hadith"?"hadith":"verse1")}
function pickTr(r){
  const col={id:3,en:2,ja:5}, order=S.lang==="id"?["id","en"]:S.lang==="ja"?["ja","en","id"]:["en","id"];
  for(const l of order){const v=r[col[l]];if(v)return {tx:v,lang:l}}
  return {tx:"",lang:""};
}
function hadithParts(r,b){
  const [n,ar,en,ind,g,ja,verse,nEnd]=r;
  const kind=b.kind||"hadith";
  const parts=[];
  if(kind==="tafsir"&&verse)parts.push({cls:"verse",lang:"ar",text:verse});
  const tr=S.lang==="ar"?{tx:""}:pickTr(r);
  const showAr=S.lang==="ar"||!tr.tx||(kind!=="tafsir"&&S.showAr);
  if(showAr&&ar)parts.push({cls:kind==="quran"?"ar quran":"ar",lang:"ar",text:ar});
  if(tr.tx)parts.push({cls:"tr",lang:tr.lang,text:tr.tx});
  if(!parts.length)parts.push({cls:"tr empty",lang:"",text:t("emptyTx"),fixed:true});
  const label=kind==="hadith"?fmt(n):`${S.curSec}:${fmt(n)}${nEnd?"–"+fmt(nEnd):""}`;
  const hn=`<div class="hn" data-n="${n}"><span class="num">${label}</span>${g?`<span class="grade" title="${esc(g)}">${esc(g.split("; ")[0])}</span>`:""}</div>`;
  return {n,hn,parts};
}
const pHTML=(pt,txt,cont)=>`<p class="${pt.cls}${cont?" cont":""}"${pt.lang?` lang="${pt.lang}"`:""}>${esc(txt)}</p>`;
function hadithHTML(r,b){const h=hadithParts(r,b);return `<article class="h" data-n="${h.n}">${h.hn}${h.parts.map(pt=>pHTML(pt,pt.text)).join("")}</article>`}

/* ---------- reader ---------- */
async function renderRead(bid,sk,anchorN){
  const b=findBook(bid); if(!b)return go("");
  const si=b.secs.findIndex(s=>s.k===String(sk)); if(si<0)return go("kitab-"+bid);
  const sec=b.secs[si];
  const keepAnchor=anchorN!=null;
  app.innerHTML=`
  <header class="top rbar"><div class="wrap">
    <a class="iconbtn" href="#kitab-${bid}" aria-label="${esc(t("back"))}">←</a>
    <div class="ttl"><select id="secsel" aria-label="${esc(t("chapter"))}">${b.secs.map(s=>`<option value="${enc(s.k)}"${s.k===sec.k?" selected":""}>${esc(bookTitle(b))} · ${esc(secTitle(s))}</option>`).join("")}</select></div>
    <button class="iconbtn" id="setbtn" aria-expanded="${!!S.panel}" aria-controls="setpanel" title="${esc(t("size"))}">Aa</button>
    <button class="iconbtn markbtn" aria-label="${esc(t("mark"))}" title="${esc(t("mark"))}">${RIB_O}</button>
    <button class="iconbtn" id="focusbtn" title="${esc(t("focus"))}" aria-label="${esc(t("focus"))}">⛶</button>
  </div></header>
  <div class="setpanel wrap" id="setpanel"${S.panel?"":" hidden"}>
      <div class="seg" role="group" aria-label="Mode"><button data-mode="scroll" aria-pressed="${S.mode==="scroll"}">${esc(t("scroll"))}</button><button data-mode="book" aria-pressed="${S.mode==="book"}">${esc(t("book"))}</button></div>
      ${langSeg()}
      ${S.lang!=="ar"?`<label class="chk"><input type="checkbox" id="showar"${S.showAr?" checked":""}>${esc(t("arabic"))}</label>`:""}
      <div class="seg" aria-label="${esc(t("size"))}"><button id="fsm" aria-label="smaller">A−</button><button id="fsp" aria-label="larger">A+</button></div>
      ${S.mode==="book"?`<div class="seg" role="group" aria-label="${esc(t("pages"))}">${["auto","single","double"].map(k=>`<button data-layout="${k}" aria-pressed="${S.layout===k}">${esc(t(k))}</button>`).join("")}</div>
      <div class="seg" role="group">${[["book","fitBook"],["fill","fitFill"]].map(([k,l])=>`<button data-fit="${k}" aria-pressed="${S.fit===k}">${esc(t(l))}</button>`).join("")}</div>`:""}
  </div>
  ${S.focus&&S.mode!=="book"?`<div class="fexit"><button class="iconbtn markbtn" aria-label="${esc(t("mark"))}">${RIB_O}</button><button class="iconbtn" id="focusexit" aria-label="${esc(t("exitFocus"))}" title="${esc(t("exitFocus"))}">✕</button></div>`:""}
  <main id="rmain"><div class="loading">${esc(t("loading"))}</div></main>`;
  document.body.classList.toggle("focus",!!S.focus);
  app.querySelectorAll("[data-layout]").forEach(x=>x.onclick=()=>{S.layout=x.dataset.layout;store.set("layout",S.layout);rerender()});
  app.querySelectorAll("[data-fit]").forEach(x=>x.onclick=()=>{S.fit=x.dataset.fit;store.set("fit",S.fit);rerender()});
  const togglePanel=()=>{S.panel=!S.panel;const p=document.getElementById("setpanel");p.hidden=!S.panel;document.getElementById("setbtn").setAttribute("aria-expanded",S.panel);if(S.mode==="book"&&!S.focus)rerender()};
  document.getElementById("setbtn").onclick=togglePanel;
  const setFocus=on=>{S.focus=on;
    try{if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement){S.fsOn=true;document.documentElement.requestFullscreen().catch(()=>{S.fsOn=false})}
        if(!on&&document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(()=>{})}}catch(e){}
    rerender()};
  document.getElementById("focusbtn").onclick=()=>setFocus(true);
  const fx=document.getElementById("focusexit");if(fx)fx.onclick=()=>setFocus(false);
  document.onfullscreenchange=()=>{if(!document.fullscreenElement&&S.fsOn){S.fsOn=false;if(S.focus){S.focus=false;rerender()}}};
  window.__setFocus=setFocus;
  document.getElementById("secsel").onchange=e=>go(`read-${bid}-${e.target.value}`);
  const rerender=()=>{const a=currentAnchor();renderRead(bid,sec.k,a)};
  app.querySelectorAll("[data-mode]").forEach(x=>x.onclick=()=>{S.mode=x.dataset.mode;store.set("mode",S.mode);rerender()});
  bindLang(app,()=>{setLangClass();rerender()});
  const sa=document.getElementById("showar"); if(sa)sa.onchange=()=>{S.showAr=sa.checked;store.set("showAr",S.showAr);rerender()};
  document.getElementById("fsm").onclick=()=>{S.fs=Math.max(.85,+(S.fs-.08).toFixed(2));store.set("fs",S.fs);document.documentElement.style.setProperty("--fs",S.fs+"rem");rerender()};
  document.getElementById("fsp").onclick=()=>{S.fs=Math.min(1.6,+(S.fs+.08).toFixed(2));store.set("fs",S.fs);document.documentElement.style.setProperty("--fs",S.fs+"rem");rerender()};

  let rows;
  try{const ch=await loadChunk(bid,sec.ch);rows=ch[sec.k]||[]}catch(e){document.getElementById("rmain").innerHTML=`<div class="loading">${esc(t("err"))}</div>`;return}
  if(route().v!=="read")return;
  const main=document.getElementById("rmain");
  S.curSec=sec.k;
  const kind=b.kind||"hadith";
  const lc=LCODE[S.lang];
  const missing=S.lang!=="ar"&&!b.langs.includes(lc);
  const shown=b.langs.includes("eng")?t("lnen"):b.langs.includes("ind")?t("lnid"):t("lnar");
  const head=`<div class="chap-head"><div class="k">${esc(t(kind==="hadith"?(/^(ahmad|darimi)$/.test(bid)?"part":"chapter"):"surah"))} ${esc(sec.k==="0"&&sec.f>1?"+":sec.k)}</div>${kind!=="hadith"&&sec.ta?`<div class="ar quran" style="text-align:center;margin:0">${esc(sec.ta)}</div>`:""}<h2>${esc(secTitle(sec))}</h2><p>${fmt(sec.c)} ${esc(t(kind==="hadith"?"hadith":"ayah"))} · ${fmt(sec.f)}–${fmt(sec.l)}</p>${missing&&t("lm")?`<p class="fallback">${esc(t("lm")+shown)}</p>`:""}${kind==="quran"&&sec.k!=="1"&&sec.k!=="9"?`<p class="ar quran bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>`:""}</div>`;
  const prevS=b.secs[si-1], nextS=b.secs[si+1];
  const pagerHTML=`<nav class="pager wrap">${prevS?`<a class="btn ghost" href="#read-${bid}-${enc(prevS.k)}">← ${esc(t("prevCh"))}</a>`:"<span></span>"}${nextS?`<a class="btn ghost" href="#read-${bid}-${enc(nextS.k)}">${esc(t("nextCh"))} →</a>`:""}</nav>`;
  const saveLast=n=>{store.set("last",{b:bid,s:sec.k,n});const pos=store.get("pos",{});pos[bid]={s:sec.k,n};store.set("pos",pos)};
  const markHere=()=>{const m=getMarks()[bid];if(!m||m.s!==sec.k)return false;
    if(S.view&&S.view.type==="book")return S.view.ns.includes(m.n);
    const el=document.querySelector(`.scroll .h[data-n="${m.n}"]`);if(!el)return false;const r=el.getBoundingClientRect();return r.bottom>60&&r.top<innerHeight};
  const syncMark=()=>{const on=markHere();document.querySelectorAll(".markbtn").forEach(x=>{x.classList.toggle("on",on);x.innerHTML=on?RIB_F:RIB_O;x.title=x.ariaLabel=on?t("unmark"):t("mark")});
    const m=getMarks()[bid];const tm=document.getElementById("tomark");
    if(tm){tm.hidden=!m||on;if(m)tm.href=atLink(bid,m.s,m.n),tm.innerHTML=`<span style="color:#B33A3A;display:inline-flex">${RIB_F}</span> ${esc(t("toMark"))} · ${fmt(m.n)}`}
    document.querySelectorAll(".h.marked").forEach(e=>e.classList.remove("marked"));if(m&&m.s===sec.k){const e=document.querySelector(`.scroll .h[data-n="${m.n}"]`);if(e)e.classList.add("marked")}};
  const toggleMark=()=>{if(markHere()){setMark(bid,null);toast(t("markOff"))}else{const n=S.view&&S.view.type==="book"?S.view.first:currentAnchor();if(n==null)return;setMark(bid,{s:sec.k,n,ts:Date.now()});toast(`${t("markSet")} ${unitOf(findBook(bid))} ${fmt(n)}`)}
    syncMark();if(S.view&&S.view.type==="book"&&S.view.redraw)S.view.redraw()};
  document.querySelectorAll(".markbtn").forEach(x=>x.onclick=toggleMark);

  if(S.mode==="scroll"){
    main.innerHTML=`<div class="wrap"><div class="scroll"><div style="text-align:center;padding-top:12px"><a class="chip tomark" id="tomark" hidden></a></div>${head}${rows.map(r=>hadithHTML(r,b)).join("")}</div></div>${pagerHTML}`;
    S.view={type:"scroll"};
    if(keepAnchor){const el=main.querySelector(`.h[data-n="${anchorN}"]`);if(el)el.scrollIntoView({block:"start"});window.scrollBy(0,-70)}else window.scrollTo(0,0);
    saveLast(keepAnchor?anchorN:rows[0]&&rows[0][0]);syncMark();
    let tm;window.onscroll=()=>{clearTimeout(tm);tm=setTimeout(()=>{const a=currentAnchor();if(a!=null)saveLast(a);syncMark()},300)};
    return;
  }
  window.onscroll=null;
  /* book mode */
  const topH=S.focus?0:document.querySelector(".top").getBoundingClientRect().height+(S.panel?document.getElementById("setpanel").getBoundingClientRect().height:0);
  const availW=window.innerWidth-(S.focus?12:Math.max(32,window.innerWidth*.04));
  const availH=Math.max(320,window.innerHeight-topH-(S.focus?56:76));
  const RATIO=0.68; // page width / height, like a printed book
  const spread=S.layout==="double"?true:S.layout==="single"?false:(availW/availH>1.05&&availW>=640);
  const cols=spread?2:1;
  let pw,bh;
  if(S.fit==="book"){bh=Math.min(availH,(availW/cols)/RATIO);pw=Math.min(availW/cols,bh*RATIO)}else{bh=availH;pw=availW/cols}
  pw=Math.floor(pw);bh=Math.floor(bh);
  // type proportional to the page: about 45-50 characters per line, user A-/A+ scales it
  const padX=Math.round(pw*(spread||pw<600?0.085:0.07)), padT=Math.round(bh*0.06), padB=Math.round(bh*0.075)+10;
  const fsb=Math.max(14,Math.min(30,(pw-padX*2)/23*(S.fs/1.06)));
  const bookStyle=`--bh:${bh}px;width:${pw*cols}px;--px:${padX}px;--pt:${padT}px;--pb:${padB}px;--fsb:${fsb.toFixed(2)}px`;
  main.innerHTML=`<div class="bookstage"><div class="book${spread?" spread":""} sized" id="book" style="${bookStyle}"></div>
    <div class="bnav"><button class="iconbtn" id="pprev" aria-label="${esc(t("prev"))}">‹</button><span id="pinfo"></span><button class="iconbtn" id="pnext" aria-label="${esc(t("next"))}">›</button><a class="chip tomark" id="tomark" hidden></a>${S.focus?`<button class="iconbtn" id="fset" aria-label="${esc(t("settings"))}">Aa</button><button class="iconbtn markbtn" aria-label="${esc(t("mark"))}">${RIB_O}</button><button class="iconbtn" id="focusexit2" aria-label="${esc(t("exitFocus"))}">✕</button>`:""}</div></div>${pagerHTML}`;
  if(S.focus){document.getElementById("fset").onclick=togglePanel;document.getElementById("focusexit2").onclick=()=>window.__setFocus(false);document.querySelectorAll(".bnav .markbtn").forEach(x=>x.onclick=()=>toggleMark())}
  const book=document.getElementById("book");
  // paginate
  const pageW=pw;
  const meas=document.createElement("div");meas.className="pg measure";meas.style.width=pageW+"px";meas.style.height="auto";book.appendChild(meas);
  const pages=[];let cur=[],curN=[];
  const limit=bh-4;
  const over=()=>meas.offsetHeight>limit;
  const newPage=()=>{pages.push({h:cur.join(""),n:curN});cur=[];curN=[];meas.innerHTML=""};
  const add=(html,n)=>{meas.insertAdjacentHTML("beforeend",html);cur.push(html);curN.push(n)};
  const undo=()=>{meas.lastElementChild.remove();cur.pop();curN.pop()};
  add(head,null);
  for(const r of rows){
    const h=hadithParts(r,b);
    add(h.hn,h.n);
    if(over()&&cur.length>1){undo();newPage();add(h.hn,h.n)}
    for(const pt of h.parts){
      let text=pt.text,cont=false;
      while(text){
        const html=pHTML(pt,text,cont);add(html,h.n);
        if(!over())break;
        undo();
        if(pt.fixed){newPage();continue}
        const cjk=text.split(" ").length<text.length/25, J=cjk?"":" ";
        const words=cjk?Array.from(text):text.split(" ");
        let lo=0,hi=words.length-1;
        while(lo<hi){const mid=Math.ceil((lo+hi)/2);meas.insertAdjacentHTML("beforeend",pHTML(pt,words.slice(0,mid).join(J)+" …",cont));const o=over();meas.lastElementChild.remove();if(o)hi=mid-1;else lo=mid}
        if(lo<(cjk?12:4)){if(cur.length){newPage();continue}lo=Math.max(lo,1)}
        add(pHTML(pt,words.slice(0,lo).join(J)+" …",cont),h.n);newPage();
        text=words.slice(lo).join(J);cont=true;
      }
    }
  }
  if(cur.length)pages.push({h:cur.join(""),n:curN});
  meas.remove();
  const step=spread?2:1;
  let p=0;
  if(keepAnchor){const pi=pages.findIndex(pg=>pg.n.includes(anchorN));if(pi>=0)p=pi-(pi%step)}
  const pageHTML=(i,cls)=>{const mk=getMarks()[bid];return pages[i]?`<div class="pg ${cls}">${mk&&mk.s===sec.k&&pages[i].n.includes(mk.n)?'<span class="ribbon"></span>':""}${pages[i].h}<div class="folio">${fmt(i+1)}</div></div>`:`<div class="pg ${cls}"></div>`};
  function draw(){
    book.innerHTML=spread?pageHTML(p,"l")+pageHTML(p+1,"r"):pageHTML(p,"s");
    document.getElementById("pinfo").textContent=`${t("page")} ${fmt(p+1)}${spread&&pages[p+1]?"–"+fmt(p+2):""} ${t("of")} ${fmt(pages.length)}`;
    document.getElementById("pprev").disabled=p===0&&!prevS;
    document.getElementById("pnext").disabled=p+step>=pages.length&&!nextS;
    const first=pages[p].n.find(x=>x!=null);if(first!=null)saveLast(first);
    S.view={type:"book",first,ns:[...pages[p].n,...(spread&&pages[p+1]?pages[p+1].n:[])],redraw:draw};
    syncMark();
  }
  draw();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let busy=false;
  function flip(dir){
    if(busy)return;
    const np=p+dir*step;
    if(np<0){if(prevS)go(`read-${bid}-${enc(prevS.k)}`);return}
    if(np>=pages.length){if(nextS)go(`read-${bid}-${enc(nextS.k)}`);return}
    if(reduce){p=np;draw();return}
    busy=true;
    const W=book.clientWidth,half=spread?W/2:W;
    const leaf=document.createElement("div");leaf.className="leaf";leaf.style.width=half+"px";
    const face=(i,cls)=>`<div class="face ${cls}">${pageHTML(i,spread?(cls==="front"?(dir>0?"r":"l"):(dir>0?"l":"r")):"s").replace('class="pg','style="height:100%" class="pg')}</div>`;
    let from,to;
    if(spread){
      if(dir>0){ // right page turns to the left
        leaf.style.left=half+"px";leaf.style.transformOrigin="left center";
        leaf.innerHTML=face(p+1,"front")+face(np,"back");
        book.children[1].outerHTML=pageHTML(np+1,"r");
        from="rotateY(0deg)";to="rotateY(-180deg)";
      }else{
        leaf.style.left="0px";leaf.style.transformOrigin="right center";
        leaf.innerHTML=face(p,"front")+face(np+1,"back");
        book.children[0].outerHTML=pageHTML(np,"l");
        from="rotateY(0deg)";to="rotateY(180deg)";
      }
    }else{
      leaf.style.left="0px";leaf.style.transformOrigin="left center";
      if(dir>0){leaf.innerHTML=face(p,"front")+`<div class="face back"><div class="pg s" style="height:100%"></div></div>`;book.children[0].outerHTML=pageHTML(np,"s");from="rotateY(0deg)";to="rotateY(-180deg)"}
      else{leaf.innerHTML=face(np,"front")+`<div class="face back"><div class="pg s" style="height:100%"></div></div>`;from="rotateY(-180deg)";to="rotateY(0deg)"}
    }
    book.appendChild(leaf);
    const anim=leaf.animate([{transform:from},{transform:to}],{duration:650,easing:"cubic-bezier(.3,.1,.25,1)"});
    anim.onfinish=()=>{p=np;draw();busy=false};
  }
  document.getElementById("pprev").onclick=()=>flip(-1);
  document.getElementById("pnext").onclick=()=>flip(1);
  book.onclick=e=>{if(e.target.closest("a,button")||getSelection().toString())return;const r=book.getBoundingClientRect();flip(e.clientX-r.left<r.width*0.3?-1:e.clientX-r.left>r.width*0.7?1:0)};
  let sx=null,sy=null;
  book.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  book.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)flip(dx<0?1:-1);sx=null},{passive:true});
  document.onkeydown=e=>{if(route().v!=="read"||e.target.closest("input,select"))return;if(e.key==="f")window.__setFocus(!S.focus);if(e.key==="Escape"&&S.focus)window.__setFocus(false);if(S.mode!=="book")return;if(e.key==="ArrowRight")flip(1);if(e.key==="ArrowLeft")flip(-1)};
}
function currentAnchor(){
  if(S.view&&S.view.type==="book")return S.view.first;
  const els=document.querySelectorAll(".scroll .h");
  for(const el of els){const r=el.getBoundingClientRect();if(r.bottom>90)return +el.dataset.n}
  return null;
}

/* ---------- main render ---------- */
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{const r=route();if(r.v==="read"&&S.mode==="book")renderRead(r.b,r.s,currentAnchor())},300)});
async function render(){
  setLangClass();
  try{await loadIndex()}catch(e){app.innerHTML=`<div class="loading">${esc(t("err"))}</div>`;return}
  const r=route();
  window.onscroll=null;
  if(r.v!=="read"){S.focus=false;document.body.classList.remove("focus")}
  if(r.v==="read")return renderRead(r.b,r.s,r.n);
  window.scrollTo(0,0);
  if(r.v==="book")return renderBook(r.b);
  renderLib();
}
render();
})();
</script>
